name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nexus archive
    runs-on: windows-2022
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install vcpkg
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout cc288af760054fa489574bd8e22d05aa8fa01e5c
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      - name: Build Windows DLL and archive
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows
          cmake --build build --config Release --target package_mod --parallel

      - name: Verify package
        id: package
        run: |
          $archives = @(Get-ChildItem dist -Filter "SmartSpellTomeSorting-*.zip")
          if ($archives.Count -ne 1) {
            throw "Expected one versioned archive, found $($archives.Count)."
          }

          $archive = $archives[0]
          $entries = tar -tf $archive.FullName
          if ($entries -notcontains "SKSE/Plugins/SmartSpellTomeSorting.dll" -or
              $entries -notcontains "SKSE/Plugins/SmartSpellTomeSorting.toml") {
            throw "Archive is missing required mod files."
          }

          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Out-File "$($archive.FullName).sha256" -Encoding ascii
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($archive.BaseName)" >> $env:GITHUB_OUTPUT

      - name: Upload Nexus-ready archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
